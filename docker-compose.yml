# KhanijDrishti — prototype compose.
# The web app runs standalone (frontend-first prototype). The postgres/redis
# services are declared (commented) to match the production roadmap; enable them
# once the FastAPI backend + adapters are added.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanijdrishti-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

